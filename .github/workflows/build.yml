name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar against Gradle's published checksums. The
      # wrapper is a binary executed by every build, including this one, so it
      # gets checked before it is allowed to run.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No display on a CI runner. The build's tests are headless by design —
      # crane-core and crane-driver-serial have no UI dependency at all, and the
      # crane-ui tests exercise input/backend logic, not scene graphs.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
